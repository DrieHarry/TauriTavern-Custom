name: Sync upstream dev

on:
  schedule:
    # Every 24 hours. GitHub Actions cron uses UTC.
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-dev
  cancel-in-progress: false

jobs:
  sync:
    name: Merge Darkatse/dev into dev
    runs-on: ubuntu-latest

    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream dev
        run: |
          git remote add upstream https://github.com/Darkatse/TauriTavern.git
          git fetch upstream dev

      - name: Check whether sync is needed
        id: check
        shell: bash
        run: |
          if git merge-base --is-ancestor upstream/dev HEAD; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "dev already contains upstream/dev. Nothing to do."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "New upstream commits found."
            fi

      - name: Merge upstream dev
        if: steps.check.outputs.needed == 'true'
        run: |
          git merge --no-edit upstream/dev

      - name: Push updated dev
        if: steps.check.outputs.needed == 'true'
        run: |
          git push origin HEAD:dev
